name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Comma or space-delimited benchmark IDs, or "default"/"all"
        required: false
        default: default
        type: string
      iterations:
        description: Complete runs per benchmark (1–100), aggregated as mean ± sample standard deviation
        required: false
        default: 1
        type: number

permissions:
  contents: read

jobs:
  benchmark:
    uses: Serock3/benchy/.github/workflows/run-benchmarks.yml@599df926f8e5e9fdf0be10be9deeef3d9def56d1
    with:
      benchmarks: ${{ inputs.benchmarks || 'default' }}
      iterations: ${{ fromJSON(format('{0}', inputs.iterations || 1)) }}
      manifest-path: benchmarks/Cargo.toml
      framework-ref: 599df926f8e5e9fdf0be10be9deeef3d9def56d1
